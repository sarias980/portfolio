<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Sergi Arias Fernández</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f5;
        --text: #1f2933;
        --muted: #435160;
        --accent: #364f6b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1622;
          --text: #e6edf4;
          --muted: #9eb0c0;
          --accent: #69d8de;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 520px;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3rem);
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        color: var(--accent);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page does not exist. <a href="/">Go to sarias.dev</a></p>

</html>
